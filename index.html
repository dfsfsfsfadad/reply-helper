<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReplyAI — умный помощник в переписке</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e11;
      --surface: #19171d;
      --surface2: #232029;
      --border: rgba(255,255,255,0.08);
      --accent: #c8a97e;
      --accent2: #9b72cf;
      --text: #f0eee8;
      --muted: #7c7987;
      --radius: 16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient orbs */
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(155,114,207,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; right: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(200,169,126,0.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }
    .logo-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(200,169,126,0.35);
      padding: 5px 14px;
      border-radius: 100px;
      margin-bottom: 1.2rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 3.5rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 0.9rem;
      background: linear-gradient(135deg, #f0eee8 30%, #c8a97e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 300;
      line-height: 1.6;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }

    /* Upload zone */
    .upload-zone {
      border: 1.5px dashed rgba(200,169,126,0.3);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: rgba(200,169,126,0.03);
      position: relative;
    }
    .upload-zone:hover, .upload-zone.drag {
      border-color: var(--accent);
      background: rgba(200,169,126,0.07);
    }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .upload-icon {
      font-size: 2rem; margin-bottom: 0.6rem;
    }
    .upload-zone p {
      font-size: 0.9rem; color: var(--muted);
    }
    .upload-zone strong {
      color: var(--accent); font-weight: 500;
    }
    .preview-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin-top: 1rem;
      object-fit: contain;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      margin: 1rem 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Textarea */
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      line-height: 1.7;
      padding: 1rem 1.25rem;
      resize: vertical;
      min-height: 130px;
      transition: border-color 0.2s;
      outline: none;
    }
    textarea:focus {
      border-color: rgba(155,114,207,0.5);
    }
    textarea::placeholder { color: var(--muted); }

    /* Button */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #c8a97e, #a8845c);
      color: #1a1208;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      border: none;
      border-radius: 12px;
      padding: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Loader */
    .loader {
      display: none;
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .loader.show { display: block; }
    .dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%,20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%,100% { content: '...'; }
    }

    /* Results */
    .results {
      display: none;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .results.show { display: flex; }

    .variant-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      position: relative;
      transition: border-color 0.2s, transform 0.15s;
      animation: fadeUp 0.4s ease both;
    }
    .variant-card:hover {
      border-color: rgba(155,114,207,0.4);
      transform: translateY(-2px);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .variant-card:nth-child(2) { animation-delay: 0.08s; }
    .variant-card:nth-child(3) { animation-delay: 0.16s; }
    .variant-card:nth-child(4) { animation-delay: 0.24s; }

    .variant-style {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 0.7rem;
    }
    .variant-text {
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--text);
    }

    .copy-btn {
      position: absolute;
      top: 1rem; right: 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .copy-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .copy-btn.copied {
      color: #5dca9b;
      border-color: #5dca9b;
    }

    .results-header {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }

    .error-msg {
      display: none;
      background: rgba(220, 80, 80, 0.08);
      border: 1px solid rgba(220, 80, 80, 0.3);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      color: #f08080;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo-tag">✦ ReplyAI</div>
      <h1>Ответь умнее,<br/><em>чем планировал</em></h1>
      <p class="subtitle">Скинь скриншот или вставь переписку — получи 4 варианта ответа<br/>на любой вкус: дружеский, с юмором, с намёком или с иронией.</p>
    </header>

    <!-- Upload -->
    <div class="card">
      <div class="section-label">📎 Скриншот переписки</div>
      <div class="upload-zone" id="dropzone">
        <input type="file" id="imgInput" accept="image/*" />
        <div class="upload-icon">🖼️</div>
        <p><strong>Нажми или перетащи</strong> скриншот сюда</p>
        <p>PNG, JPG, WEBP — до 10 МБ</p>
        <img id="imgPreview" class="preview-img" style="display:none"/>
      </div>
    </div>

    <div class="divider">или</div>

    <!-- Text -->
    <div class="card">
      <div class="section-label">💬 Текст переписки</div>
      <textarea id="textInput" placeholder="Вставь сообщения сюда. Например:&#10;&#10;— Привет, ты там жив? 😅&#10;— Почти. Работаю...&#10;— Понятно. Можем встретиться в пятницу?"></textarea>
    </div>

    <!-- Submit -->
    <button class="btn" id="submitBtn" onclick="analyze()">
      ✨ Сгенерировать варианты ответа
    </button>

    <!-- Loader -->
    <div class="loader" id="loader">
      <p>Думаю над вариантами<span class="dots"></span></p>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- Results -->
    <div style="margin-top:2rem" id="resultsWrap">
      <div class="results-header" id="resultsLabel"></div>
      <div class="results" id="results"></div>
    </div>
  </div>

  <script>
    // Drag & drop
    const dropzone = document.getElementById('dropzone');
    const imgInput = document.getElementById('imgInput');
    const imgPreview = document.getElementById('imgPreview');

    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault(); dropzone.classList.remove('drag');
      const file = e.dataTransfer.files[0];
      if (file) setImage(file);
    });
    imgInput.addEventListener('change', () => {
      if (imgInput.files[0]) setImage(imgInput.files[0]);
    });

    function setImage(file) {
      const reader = new FileReader();
      reader.onload = e => {
        imgPreview.src = e.target.result;
        imgPreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function analyze() {
      const text = document.getElementById('textInput').value.trim();
      const file = imgInput.files[0];

      if (!text && !file) {
        showError('Пожалуйста, добавь скриншот или вставь текст переписки 🙏');
        return;
      }

      const btn = document.getElementById('submitBtn');
      const loader = document.getElementById('loader');
      const results = document.getElementById('results');
      const errorMsg = document.getElementById('errorMsg');
      const resultsLabel = document.getElementById('resultsLabel');

      btn.disabled = true;
      loader.classList.add('show');
      results.classList.remove('show');
      results.innerHTML = '';
      errorMsg.classList.remove('show');
      resultsLabel.textContent = '';

      const formData = new FormData();
      if (text) formData.append('text', text);
      if (file) formData.append('image', file);

      try {
        const res = await fetch('/analyze', { method: 'POST', body: formData });
        if (!res.ok) {
          const err = await res.text();
          throw new Error(err || 'Сервер вернул ошибку');
        }
        const data = await res.json();

        resultsLabel.textContent = '✦ Варианты ответа';
        data.variants.forEach(v => {
          const card = document.createElement('div');
          card.className = 'variant-card';
          card.innerHTML = `
            <div class="variant-style">${v.style}</div>
            <div class="variant-text">${v.text}</div>
            <button class="copy-btn" onclick="copyText(this, \`${v.text.replace(/`/g, '\\`')}\`)">Копировать</button>
          `;
          results.appendChild(card);
        });

        results.classList.add('show');
      } catch (e) {
        showError('Что-то пошло не так: ' + e.message);
      } finally {
        btn.disabled = false;
        loader.classList.remove('show');
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Скопировано ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Копировать';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
